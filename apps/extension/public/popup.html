<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
    <title>Downloader</title>
  </head>
  <body class="popup">
    <header><strong>Downloader</strong><span id="connection" data-i18n="working"></span></header>
    <div class="stats">
      <div><strong id="active">—</strong><span data-i18n="active"></span></div>
      <div><strong id="complete">—</strong><span data-i18n="completed"></span></div>
    </div>
    <p id="error" role="status"></p>
    <button id="continue-navigation" data-i18n="continueNavigation"></button
    ><button id="try-solver" data-i18n="trySolver"></button
    ><button id="refresh-session" data-i18n="refreshSession"></button
    ><button id="bypass" data-i18n="bypass"></button
    ><button id="options" data-i18n="options"></button><small data-i18n="readonly"></small>
    <script src="popup.js"></script>
  </body>
</html>
