name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev librsvg2-dev patchelf libcurl4-openssl-dev libssl-dev
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo test -p downloader-core -p downloader-service -p downloader-cli
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: cargo build -p downloader-service -p downloader-cli
      - run: node scripts/prepare-sidecar.mjs --debug
      - run: cargo check -p downloader-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ runner.os }}
          path: apps/extension/dist
