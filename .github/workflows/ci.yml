name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      large:
        description: Run actual downloads above 4 GiB on every platform
        type: boolean
        default: false
      filesystem:
        description: Qualify disk-full, permission and cross-volume recovery on disposable images
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev librsvg2-dev patchelf libcurl4-openssl-dev libssl-dev libnghttp2-dev libkrb5-dev libproxy1v5 libpacparser1
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: cargo fmt --all -- --check
      - run: cargo test -p downloader-core -p downloader-service -p downloader-cli --features downloader-core/fault-injection
      - run: cargo clippy -p downloader-core -p downloader-service -p downloader-cli --all-targets --features downloader-core/fault-injection -- -D warnings
      - name: Qualification binary
        run: cargo build --release -p downloader-core --example qualify --example qualify_filesystem
        env:
          CARGO_TARGET_DIR: .local/engine-target
      - name: Disposable CI fixture hostname
        run: node scripts/fixture-host.mjs
      - name: Protocol, proxy, authentication and performance fixtures
        run: node scripts/qualify-network.mjs .local/network-qualification --benchmark
      - name: Actual large-file recovery
        if: github.event_name == 'workflow_dispatch' && inputs.large
        run: node scripts/qualify-network.mjs .local/large-qualification --only large_over_4gib --large
      - name: Actual filesystem recovery
        if: github.event_name == 'workflow_dispatch' && inputs.filesystem
        run: node scripts/qualify-filesystem.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transfer-evidence-${{ runner.os }}
          path: |
            .local/network-qualification/results.json
            .local/large-qualification/results.json
            .local/filesystem-results.json
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/version.mjs --artifacts
      - run: cargo build -p downloader-service -p downloader-cli
      - name: CLI and native IPC lifecycle acceptance
        run: node scripts/qualify-control.mjs .local/control-qualification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-evidence-${{ runner.os }}
          path: .local/control-qualification/results.json
      - run: node scripts/prepare-sidecar.mjs --debug
      - run: cargo check -p downloader-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ runner.os }}
          path: apps/extension/dist
