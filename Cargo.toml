[workspace]
members = ["crates/core", "crates/service", "crates/cli", "apps/desktop/src-tauri"]
default-members = ["crates/core", "crates/service", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.16.2"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.93"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
curl = { version = "0.4", features = ["http2", "protocol-ftp", "ntlm"] }
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
url = "2"
dirs = "6"
interprocess = "2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
scraper = "0.25"
regex = "1"
zip = { version = "7", default-features = false, features = ["deflate"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }

[profile.release]
lto = "thin"
strip = true
